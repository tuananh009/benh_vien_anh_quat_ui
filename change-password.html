<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đổi mật khẩu lần đầu · Trung tâm điều hành số Bệnh viện Anh Quất</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="auth">
  <div class="auth__card">
    <div class="auth__brand">
      <div class="auth__brand-name">Đổi mật khẩu lần đầu</div>
      <p class="text-meta" style="margin-top:8px">Anh/chị cần đặt mật khẩu mới trước khi sử dụng hệ thống.</p>
    </div>

    <form onsubmit="return false">
      <div class="field">
        <label class="field__label" for="current-password">Mật khẩu hiện tại</label>
        <input class="input" id="current-password" type="password" autocomplete="current-password" autofocus>
      </div>

      <div class="field">
        <label class="field__label" for="next-password">Mật khẩu mới</label>
        <div class="input-with-affix">
          <input class="input" id="next-password" type="password" autocomplete="new-password">
          <button class="input-affix" type="button" data-action="toggle-password"
                  data-target="next-password" aria-label="Hiện mật khẩu">👁</button>
        </div>
        <p class="field__hint">Tối thiểu 8 ký tự</p>
      </div>

      <div class="field has-error">
        <label class="field__label" for="repeat-password">Nhập lại mật khẩu mới</label>
        <input class="input" id="repeat-password" type="password" autocomplete="new-password" value="matkhau">
        <p class="field__hint">Mật khẩu nhập lại chưa khớp</p>
      </div>

      <button class="btn btn--primary btn--large btn--block" type="submit"
              data-action="demo-submit" data-busy-label="Đang đổi mật khẩu…"
              data-next="my-tasks.html" data-toast="Đã đổi mật khẩu">Đổi mật khẩu</button>
    </form>

    <div class="auth__footer"><a href="login.html">Đăng xuất</a></div>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
